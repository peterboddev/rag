version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
      - npm install -g aws-cdk@latest
      - cd frontend && npm install --no-audit --no-fund && cd ..
  
  pre_build:
    commands:
      - echo "Running tests..."
      - export NODE_OPTIONS="--max-old-space-size=4096"
      - npm run test
  
  build:
    commands:
      - echo "Building application..."
      - npm run build
      - echo "Synthesizing CDK stack..."
      - cdk synth 2>&1 || (echo "CDK synth failed with exit code $?" && exit 1)
  
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - '**/*'
  # Include ALL files - required for npx cdk deploy in deploy stage
  # Platform team's deploy stage needs: source code, cdk.out/, package.json, node_modules, and asset directories

cache:
  paths:
    - 'node_modules/**/*'
